name: Signed macOS release
on:
  push:
    tags: ['v*.*.*']
permissions:
  contents: write
jobs:
  release:
    runs-on: macos-14
    environment: release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Check version and signing credentials
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          test -n "$CSC_LINK" && test -n "$CSC_KEY_PASSWORD"
          test -n "$APPLE_API_KEY" && test -n "$APPLE_API_KEY_ID" && test -n "$APPLE_API_ISSUER"
          test "$GITHUB_REF_NAME" = "v$(node -p "require('./apps/desktop/package.json').version")"
      - run: npm ci --ignore-scripts
      - run: node node_modules/electron/install.js
      - run: npm run check
      - run: npm audit --audit-level=high
      - name: Prepare notarization key
        env:
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY }}
        run: |
          node --input-type=module - <<'JS'
          import {writeFileSync,appendFileSync} from 'node:fs'
          import path from 'node:path'
          const keyPath=path.join(process.env.RUNNER_TEMP,'KafkaLens-notarization.p8')
          writeFileSync(keyPath,Buffer.from(process.env.APPLE_API_KEY_BASE64,'base64'),{mode:0o600})
          appendFileSync(process.env.GITHUB_ENV,`APPLE_API_KEY=${keyPath}\n`)
          JS
      - name: Build signed and notarized artifacts
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm exec -w apps/desktop electron-builder -- --mac --arm64 --x64 --publish never
      - name: Verify signatures and notarization
        run: |
          for app in apps/desktop/release/mac*/KafkaLens.app; do
            codesign --verify --deep --strict --verbose=2 "$app"
            spctl --assess --type execute --verbose=2 "$app"
          done
      - name: Remove temporary notarization key
        if: always()
        run: rm -f "$RUNNER_TEMP/KafkaLens-notarization.p8"
      - run: node scripts/generate-cask.mjs "${GITHUB_REF_NAME#v}"
      - name: Stage release files
        run: cp apps/desktop/release/homebrew/kafkalens.rb apps/desktop/release/kafkalens.rb
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.blockmap
            apps/desktop/release/latest-mac.yml
            apps/desktop/release/kafkalens.rb
